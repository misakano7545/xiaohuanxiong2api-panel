name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...
      - name: build
        run: go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA::7}" -o xhx2api ./cmd/server
      - name: docker
        run: docker build -t xhx2api:ci .
